<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaultix Browser 设置</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body class="options">
    <div class="options-page">
      <header class="options-header">
        <span class="brand-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="10" width="16" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="15.5" r="1.4" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div class="titles">
          <h1>Vaultix Browser 设置</h1>
          <p>只保存非敏感配置；主密码与派生密钥永不写入磁盘</p>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <span class="badge source-badge bitwarden" aria-hidden="true">BW</span>
          <div>
            <h2>Bitwarden / Vaultwarden</h2>
            <p>两种服务共用一套实现，仅端点不同</p>
          </div>
        </div>
        <div class="card-body grid-2">
          <label class="field">
            <span>后端类型</span>
            <select id="mode">
              <option value="bitwarden.cloud">Bitwarden 官方云</option>
              <option value="vaultwarden">自建 Vaultwarden</option>
            </select>
          </label>
          <label class="field">
            <span>邮箱</span>
            <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
          </label>
          <label class="field" style="grid-column: 1 / -1">
            <span>服务地址 <em>自建时填写</em></span>
            <input id="server-url" type="url" placeholder="https://vault.example.com" />
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="badge source-badge keepassxc" aria-hidden="true">KP</span>
          <div>
            <h2>KeePassXC</h2>
            <p>通过 Native Messaging 连接本地密码库</p>
          </div>
        </div>
        <div class="card-body">
          <div class="inline-row">
            <button id="associate" class="ghost-btn" type="button">配对 KeePassXC</button>
            <span id="association-status" class="hint"></span>
          </div>
          <p class="hint">需先安装 keepassxc-proxy，并在 KeePassXC 设置中允许本扩展连接。</p>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="badge source-badge bitwarden" aria-hidden="true">⏱</span>
          <div>
            <h2>安全与保存策略</h2>
            <p>解锁状态与默认写回目标</p>
          </div>
        </div>
        <div class="card-body grid-2">
          <label class="field">
            <span>后台锁定 <em>分钟</em></span>
            <input id="background-lock" type="number" min="1" value="5" />
          </label>
          <label class="field">
            <span>空闲锁定 <em>分钟</em></span>
            <input id="idle-lock" type="number" min="1" value="15" />
          </label>
          <label class="field" style="grid-column: 1 / -1">
            <span>默认保存目标</span>
            <select id="default-save-source">
              <option value="bitwarden">Bitwarden / Vaultwarden</option>
              <option value="keepassxc">KeePassXC</option>
            </select>
          </label>
        </div>
        <div class="card-body" style="padding-top: 0">
          <div class="callout">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
            </svg>
            <span
              >主密码、派生密钥与明文凭证永不落盘。会话态只存于浏览器内存，关闭浏览器即失效；新凭证在用户确认后写回你已有的密码库。</span
            >
          </div>
        </div>
      </section>

      <div class="page-actions">
        <button id="save" class="primary-btn" type="button">保存设置</button>
        <span id="saved" class="toast" role="status"></span>
      </div>

      <p class="options-footer">Vaultix Browser · 本地优先的凭证填充器</p>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
